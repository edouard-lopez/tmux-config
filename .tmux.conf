# Set default shell
set-option -g default-shell "/usr/bin/fish"

# change PREFIX to Ctrl+a
set-option -g prefix C-a

#set -g @colors-base16 'base16-ayu-light' # one-light
#set -g @colors-base16 'base16-ayu-dark' # nove
set -g allow-passthrough on # tmux 3.3a fix, see https://github.com/tinted-theming/base16-shell/issues/1


# reload config
bind R  run $HOME/dotfiles/install.sh           \; \
        source-file $HOME/.tmux.conf            \; \
        source-file $HOME/.tmux/variables.tmux  \; \
        source-file $HOME/.tmux/panes.tmux      \; \
        source-file $HOME/.tmux/status-bar.tmux \; \
        source-file $HOME/.tmux/terminal.tmux   \; \
        source-file $HOME/.tmux/vi.tmux         \; \
        source-file $HOME/.tmux/windows.tmux    \; \
        source-file $HOME/.tmux/plugins.tmux    \; \
        display "Configuration Reloaded!"

source-file $HOME/.tmux/variables.tmux
source-file $HOME/.tmux/panes.tmux
source-file $HOME/.tmux/status-bar.tmux
source-file $HOME/.tmux/terminal.tmux
source-file $HOME/.tmux/vi.tmux
source-file $HOME/.tmux/windows.tmux
# load plugins last
source-file $HOME/.tmux/plugins.tmux

set -g update-environment "SSH_AUTH_SOCK SSH_ASKPASS WINDOWID SSH_CONNECTION XAUTHORITY"
run-shell "tmux set-option -g @tinted-color $($HOME/apps/tinty current)"
set-option -g default-command "fish --login" # fish+tmux+ssh https://superuser.com/a/486577/174465
